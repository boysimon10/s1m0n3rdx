<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800;900&family=Geist+Mono:wght@500;600&family=Dela+Gothic+One&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #f4f3ef;
        color: #0b0b0b;
        font-family: "Schibsted Grotesk", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "Geist Mono", monospace;
      }
      .sfx {
        font-family: "Dela Gothic One", sans-serif;
      }
      body {
        padding: 36px;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 40px;
        align-items: center;
        background-image: radial-gradient(#0b0b0b 1.2px, transparent 1.6px);
        background-size: 12px 12px;
        background-color: #f4f3ef;
      }
      .poster {
        background: #fff;
        border: 5px solid #0b0b0b;
        padding: 22px;
        box-shadow: 14px 14px 0 #e5352b;
        transform: rotate(-2deg);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .w {
        font: 400 62px/0.9 "Dela Gothic One";
        text-align: center;
        letter-spacing: -0.02em;
      }
      .photo {
        position: relative;
        aspect-ratio: 1;
        border: 4px solid #0b0b0b;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(1) contrast(1.2);
      }
      .stamp {
        position: absolute;
        right: 10px;
        bottom: 12px;
        padding: 8px 12px;
        background: #e5352b;
        color: #fff;
        border: 3px solid #0b0b0b;
        font: 600 18px/1 "Geist Mono";
        transform: rotate(-5deg);
      }
      .bounty {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: #0b0b0b;
        color: #f4f3ef;
      }
      .bounty b {
        font: 400 34px/1 "Dela Gothic One";
        color: #ff7a70;
      }
      .right {
        display: flex;
        flex-direction: column;
        gap: 22px;
        background: #f4f3ef;
        padding: 20px 0;
      }
      h1 {
        font-weight: 900;
        font-size: 100px;
        line-height: 0.86;
        letter-spacing: -0.055em;
      }
      h1 span {
        color: #e5352b;
      }
      .line {
        font: 500 26px/1.3 "Geist Mono";
      }
      .chip {
        align-self: flex-start;
        padding: 14px 18px;
        background: #e5352b;
        color: #fff;
        border: 3px solid #0b0b0b;
        font: 600 24px/1 "Geist Mono";
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="w">WANTED</div>
      <div class="photo">
        <img src="../../src/assets/avatar.png" /><span class="stamp">DEAD OR ALIVE</span>
      </div>
      <div class="bounty">
        <span class="mono" style="font-size: 18px">BOUNTY</span><b>10,000 h</b>
      </div>
    </div>
    <div class="right">
      <h1>s1m0n3rdx<span>.</span></h1>
      <div class="line">Software Engineer · Dakar<br />blog, projects &amp; void</div>
      <span class="chip">s1m0n.engineer</span>
    </div>
  </body>
</html>
