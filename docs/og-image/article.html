<!doctype html>
<!-- usage: article.html?title=My%20title&label=Blog -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Geist+Mono:wght@500;600&display=block"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        padding: 40px;
        background: #eeeadb;
        color: #141310;
        font-family: "Schibsted Grotesk", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        height: 100%;
        padding: 56px 64px;
        border: 3px solid #141310;
        border-radius: 32px;
        background: #faf8f1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top { display: flex; align-items: center; justify-content: space-between; }
      .author { display: flex; align-items: center; gap: 20px; }
      .avatar {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 3px solid #141310;
        background: #ec9b5a;
        object-fit: cover;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 16px 24px;
        border-radius: 999px;
        font: 500 26px/1 "Geist Mono", monospace;
        border: 3px solid #141310;
      }
      .domain { background: #ec9b5a; font-weight: 600; }
      .dark { background: #141310; color: #eeeadb; }
      h1 {
        font-weight: 800;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="author">
          <img class="avatar" src="../../src/assets/avatar.png" alt="" />
          <span class="pill dark" id="label">Blog</span>
        </div>
        <span class="pill domain">s1m0n.engineer</span>
      </div>
      <h1 id="title">Article title</h1>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      for (const id of ["title", "label"]) {
        const value = params.get(id);
        if (value) document.getElementById(id).textContent = value;
      }
    </script>
  </body>
</html>
