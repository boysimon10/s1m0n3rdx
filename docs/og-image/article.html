<!doctype html>
<!-- usage: article.html?title=My%20title&vol=01 -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800;900&family=Geist+Mono:wght@500;600&family=Dela+Gothic+One&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #f4f3ef;
        color: #0b0b0b;
        font-family: "Schibsted Grotesk", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "Geist Mono", monospace;
      }
      .sfx {
        font-family: "Dela Gothic One", sans-serif;
      }
      body {
        padding: 36px;
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 56px;
        align-items: center;
        background-image: radial-gradient(#0b0b0b 1.1px, transparent 1.5px);
        background-size: 12px 12px;
      }
      .left {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        background: #f4f3ef;
        padding: 16px;
      }
      .left img {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 6px solid #0b0b0b;
        object-fit: cover;
        filter: grayscale(1) contrast(1.15);
      }
      .vol {
        font: 400 56px/1 "Dela Gothic One";
        color: #e5352b;
        -webkit-text-stroke: 3px #0b0b0b;
        paint-order: stroke fill;
      }
      .bubble {
        position: relative;
        background: #fff;
        border: 6px solid #0b0b0b;
        border-radius: 80px;
        padding: 56px 60px;
      }
      .bubble:before,
      .bubble:after {
        content: "";
        position: absolute;
        clip-path: polygon(100% 0, 0 60%, 100% 100%);
      }
      .bubble:before {
        left: -50px;
        top: 170px;
        width: 56px;
        height: 56px;
        background: #0b0b0b;
      }
      .bubble:after {
        left: -36px;
        top: 180px;
        width: 42px;
        height: 38px;
        background: #fff;
      }
      h1 {
        font-weight: 900;
        font-size: 68px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 22px;
        font: 600 22px/1 "Geist Mono";
      }
      .meta b {
        color: #e5352b;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <img src="../../src/assets/avatar.png" /><span class="vol">VOL.<span id="vol">01</span></span>
    </div>
    <div class="bubble">
      <div class="meta"><b>BLOG · s1m0n3rdx</b><span>s1m0n.engineer</span></div>
      <h1 id="title">Article title</h1>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      for (const id of ["title", "vol"]) {
        const value = params.get(id);
        if (value) document.getElementById(id).textContent = value;
      }
    </script>
  </body>
</html>
